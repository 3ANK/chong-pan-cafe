const encodeBase64=array=>{let binary="";for(let i=0;i<array.length;i+=0x8000)binary+=String.fromCharCode(...array.subarray(i,Math.min(i+0x8000,array.length)));return btoa(binary);};
async function decryptRecipeState(encrypted,passphrase){const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(passphrase),"PBKDF2",false,["deriveKey"]);const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:bytes(encrypted.salt),iterations:600000,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["decrypt"]);const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(encrypted.iv)},key,bytes(encrypted.data));return JSON.parse(new TextDecoder().decode(plain));}
async function encryptRecipeState(state,passphrase){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(passphrase),"PBKDF2",false,["deriveKey"]);const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:600000,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["encrypt"]);const cipher=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(state)));return {salt:encodeBase64(salt),iv:encodeBase64(iv),data:encodeBase64(new Uint8Array(cipher))};}function applyRecipeState(state){let legacyFeatured="";if(Array.isArray(state)){recipes=state;recipeOrder=[];}else{recipes=Array.isArray(state?.recipes)?state.recipes:[];recipeOrder=Array.isArray(state?.recipeOrder)?state.recipeOrder:[];legacyFeatured=typeof state?.featuredRecipe==="string"?state.featuredRecipe:"";}normalizeRecipeOrder();if(legacyFeatured&&!state?.recipeOrder?.length&&recipeOrder.includes(legacyFeatured))recipeOrder=[legacyFeatured,...recipeOrder.filter(key=>key!==legacyFeatured)];featuredRecipe=recipeOrder[0]||"";refreshCategories();render();}

const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));function recipeKey(category,name){return JSON.stringify([category,name]);}
function getDefaultRecipeOrder(){const keys=[];for(const notebookFirst of [true,false])for(const group of recipes)for(const name of group.names)if(!!group.details?.[name]?.shopNotebook===notebookFirst)keys.push(recipeKey(group.category,name));return keys;}
function normalizeRecipeOrder(){const valid=new Set(recipes.flatMap(group=>group.names.map(name=>recipeKey(group.category,name))));recipeOrder=[...new Set(recipeOrder)].filter(key=>valid.has(key));for(const key of getDefaultRecipeOrder())if(!recipeOrder.includes(key))recipeOrder.push(key);}

function saveVisibleEdits(){
  for(const card of $('cards').querySelectorAll('[data-has-detail="true"]')){

    if(size){const match=size.innerText.match(/ขนาดแก้ว\s*(.*?)\s*ออนซ์/);if(match&&match[1])detail.size=match[1].trim();}
  }}function render(){

      move.addEventListener('click',()=>{saveVisibleEdits();recipeOrder=[key,...recipeOrder.filter(item=>item!==key)];featuredRecipe=key;$('saveStatus').textContent='ย้ายสูตรขึ้นลำดับแรกแล้ว สูตรเดิมเลื่อนลงมา กดบันทึกเพื่อเก็บการเปลี่ยนแปลง';render();setEditableCards();});

      remove.addEventListener('click',()=>{saveVisibleEdits();const groupIndex=Number(card.dataset.groupIndex),target=recipes[groupIndex];target.names=target.names.filter(item=>item!==name);if(target.details)delete target.details[name];recipeOrder=recipeOrder.filter(item=>item!==key);if(featuredRecipe===key)featuredRecipe=recipeOrder[0]||'';if(!target.names.length)recipes.splice(groupIndex,1);refreshCategories();render();setEditableCards();$('saveStatus').textContent='ลบออกจากรายการแล้ว กดบันทึกเพื่อยืนยัน หรือยกเลิกเพื่อคืนสูตร';});

  let group=recipes.find(item=>item.category===category);
  if(group?.names.includes(name)){$('newRecipeError').textContent='มีสูตรชื่อนี้ในหมวดหมู่นี้แล้ว';return;}
  if(!ingredients.length){$('newRecipeError').textContent='กรุณาใส่วัตถุดิบอย่างน้อยหนึ่งรายการ';return;}
  if(!group){group={category,names:[],details:{}};recipes.push(group);}
  if(!group.details)group.details={};
  group.names.push(name);
  group.details[name]={title:name,ingredients,size:$('newRecipeSize').value.trim(),steps,notes,shopNotebook:true};
    recipeOrder.push(recipeKey(category,name));
  $('newRecipeForm').reset();$('newRecipeForm').hidden=true;
  refreshCategories();$('category').value=category;$('search').value='';
  render();setEditableCards();$('saveStatus').textContent='เพิ่มสูตรแล้ว กดบันทึกเพื่อเก็บการเปลี่ยนแปลง';
});
$('cancelEdits').addEventListener('click',()=>{  if(editBackup)recipes=editBackup;recipeOrder=orderBackup;featuredRecipe=featuredBackup;editBackup=null;orderBackup=[];featuredBackup='';editing=false;
  $('newRecipeForm').reset();$('newRecipeForm').hidden=true;$('saveStatus').textContent='ยกเลิกการแก้ไขแล้ว';
  refreshCategories();updateEditControls();render();
});
$('saveEdits').addEventListener('click',async()=>{
  $('saveEdits').disabled=true;$('saveStatus').textContent='กำลังบันทึกและซิงก์สูตร…';
  try{
    saveVisibleEdits();
    const encrypted=await encryptRecipeState({version:1,recipes,recipeOrder},currentPassphrase);
    const saved=await supabaseFetch('rest/v1/rpc/save_recipe_state',{method:'POST',body:{p_passcode:currentPassphrase,p_payload:encrypted}});
    if(!saved?.id)throw new Error('permission');lastUpdatedAt=saved.updated_at||'';
    editing=false;editBackup=null;featuredBackup='';$('newRecipeForm').hidden=true;$('saveStatus').textContent='บันทึกและซิงก์สูตรกับทุกอุปกรณ์แล้ว';
    updateEditControls();render();
  }catch(error){$('saveStatus').textContent='บันทึกไม่สำเร็จ กรุณาตรวจสอบรหัสผ่านและการเชื่อมต่อแล้วลองอีกครั้ง';}
  finally{$('saveEdits').disabled=false;}
});
$('login').addEventListener('submit',async event=>{
  event.preventDefault();$('error').textContent='';$('submit').disabled=true;
  try{
    if(!crypto.subtle)throw new Error('unsupported');
    currentPassphrase=$('password').value;
    const remote=await loadCloudRecipeState();
    let state=await decryptRecipeState(remote?.payload||payload,currentPassphrase);
    if(!remote){try{const oldRecipes=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(Array.isArray(oldRecipes)){state={recipes:oldRecipes,featuredRecipe:localStorage.getItem(PIN_KEY)||''};$('saveStatus').textContent='พบสูตรที่บันทึกไว้ในอุปกรณ์นี้ กดแก้ไขสูตรแล้วบันทึกเพื่อซิงก์';}}catch(e){}}
    applyRecipeState(state);$('gate').hidden=true;$('book').hidden=false;$('lock').hidden=false;$('password').value='';render();subscribeToRecipeUpdates();$('search').focus();
  }catch(error){currentPassphrase='';$('error').textContent=error.message==='unsupported'?'กรุณาเปิดหน้านี้ผ่าน HTTPS':(error.message==='permission'||error.message==='Failed to fetch'?'โหลดสูตรไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต':'รหัสผ่านไม่ถูกต้อง กรุณาลองอีกครั้ง');}
  finally{$('submit').disabled=false;}
});
$('search').addEventListener('input',render);$('category').addEventListener('change',render);$('editMode').hidden=false;$('editorBar').hidden=false;updateEditControls();$('lock').addEventListener('click',()=>{if(syncTimer){clearInterval(syncTimer);syncTimer=null;}currentPassphrase='';editing=false;recipes=[];$('cards').replaceChildren();$('search').value='';$('book').hidden=true;$('lock').hidden=true;$('gate').hidden=false;$('password').focus();});
</script></body></html>
