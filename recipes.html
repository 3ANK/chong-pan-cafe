teps">วิธีทำ (บรรทัดละหนึ่งขั้นตอน)</label><textarea id="newRecipeSteps"></textarea><label for="newRecipeNotes">หมายเหตุ (ถ้ามี)</label><textarea id="newRecipeNotes"></textarea><div class="form-actions"><button type="submit">เพิ่มสูตร</button><button id="closeRecipeForm" type="button">ปิด</button></div><p id="newRecipeError" role="alert" aria-live="polite"></p></form><div class="tools"><input id="search" type="search" placeholder="ค้นหาชื่อเมนู" aria-label="ค้นหาชื่อเมนู"><button id="voiceSearch" class="voice-button" type="button" aria-label="พูดเพื่อค้นหา">🎙️ พูดเพื่อค้นหา</button><span id="voiceSearchStatus" class="voice-status" role="status" aria-live="polite"></span><select id="category" aria-label="หมวดหมู่"><option value="">ทุกหมวด</option></select></div><div id="cards" class="grid"></div><p id="noResults" hidden>ไม่พบเมนูที่ค้นหา</p><footer>กด “ล็อกหน้า” เมื่อใช้งานเสร็จ</footer></section></main><script>

const encodeBase64=array=>{let binary="";for(let i=0;i<array.length;i+=0x8000)binary+=String.fromCharCode(...array.subarray(i,Math.min(i+0x8000,array.length)));return btoa(binary);};

  if(!group.details)group.details={};
  group.names.push(name);
  group.details[name]={title:name,ingredients,size:$('newRecipeSize').value.trim(),steps,notes,shopNotebook:true};
    recipeOrder.push(recipeKey(category,name));
  $('newRecipeForm').reset();$('newRecipeForm').hidden=true;
  refreshCategories();$('category').value=category;$('search').value='';
  render();setEditableCards();$('saveStatus').textContent='เพิ่มสูตรแล้ว กดบันทึกเพื่อเก็บการเปลี่ยนแปลง';
});
$('cancelEdits').addEventListener('click',()=>{  if(editBackup)recipes=editBackup;recipeOrder=orderBackup;featuredRecipe=featuredBackup;editBackup=null;orderBackup=[];featuredBackup='';editing=false;
  $('newRecipeForm').reset();$('newRecipeForm').hidden=true;$('saveStatus').textContent='ยกเลิกการแก้ไขแล้ว';
  refreshCategories();updateEditControls();render();
});
$('saveEdits').addEventListener('click',async()=>{
  $('saveEdits').disabled=true;$('saveStatus').textContent='กำลังบันทึกและซิงก์สูตร…';
  try{
    saveVisibleEdits();
    const encrypted=await encryptRecipeState({version:1,recipes,recipeOrder},currentPassphrase);
    const saved=await supabaseFetch('rest/v1/rpc/save_recipe_state',{method:'POST',body:{p_passcode:currentPassphrase,p_payload:encrypted}});
    if(!saved?.id)throw new Error('permission');lastUpdatedAt=saved.updated_at||'';
    editing=false;editBackup=null;featuredBackup='';$('newRecipeForm').hidden=true;$('saveStatus').textContent='บันทึกและซิงก์สูตรกับทุกอุปกรณ์แล้ว';
    updateEditControls();render();
  }catch(error){$('saveStatus').textContent='บันทึกไม่สำเร็จ กรุณาตรวจสอบรหัสผ่านและการเชื่อมต่อแล้วลองอีกครั้ง';}
  finally{$('saveEdits').disabled=false;}
});
$('login').addEventListener('submit',async event=>{
  event.preventDefault();$('error').textContent='';$('submit').disabled=true;
  try{
    if(!crypto.subtle)throw new Error('unsupported');
    currentPassphrase=$('password').value;
    const remote=await loadCloudRecipeState();
    let state=await decryptRecipeState(remote?.payload||payload,currentPassphrase);
    if(!remote){try{const oldRecipes=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(Array.isArray(oldRecipes)){state={recipes:oldRecipes,featuredRecipe:localStorage.getItem(PIN_KEY)||''};$('saveStatus').textContent='พบสูตรที่บันทึกไว้ในอุปกรณ์นี้ กดแก้ไขสูตรแล้วบันทึกเพื่อซิงก์';}}catch(e){}}
    applyRecipeState(state);$('gate').hidden=true;$('book').hidden=false;$('lock').hidden=false;$('password').value='';render();subscribeToRecipeUpdates();$('search').focus();
  }catch(error){currentPassphrase='';$('error').textContent=error.message==='unsupported'?'กรุณาเปิดหน้านี้ผ่าน HTTPS':(error.message==='permission'||error.message==='Failed to fetch'?'โหลดสูตรไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต':'รหัสผ่านไม่ถูกต้อง กรุณาลองอีกครั้ง');}
  finally{$('submit').disabled=false;}
});
$('search').addEventListener('input',render);$('category').addEventListener('change',render);
const voiceSearchButton=$('voiceSearch'),voiceSearchStatus=$('voiceSearchStatus');
const SpeechRecognitionAPI=window.SpeechRecognition||window.webkitSpeechRecognition;
let voiceRecognition=null,voiceListening=false;
if(!SpeechRecognitionAPI){voiceSearchButton.disabled=true;voiceSearchButton.title='เบราว์เซอร์นี้ยังไม่รองรับการค้นหาด้วยเสียง';voiceSearchStatus.textContent='เบราว์เซอร์นี้ไม่รองรับการค้นหาด้วยเสียง กรุณาพิมพ์ค้นหา';}
else{
  voiceRecognition=new SpeechRecognitionAPI();voiceRecognition.lang='th-TH';voiceRecognition.continuous=false;voiceRecognition.interimResults=false;
  voiceRecognition.onstart=()=>{voiceListening=true;voiceSearchButton.textContent='⏹ หยุดพูด';voiceSearchStatus.textContent='กำลังฟัง พูดชื่อเมนูที่ต้องการค้นหา';};
  voiceRecognition.onresult=event=>{const spoken=event.results?.[0]?.[0]?.transcript?.trim();if(spoken){$('search').value=spoken;$('search').dispatchEvent(new Event('input',{bubbles:true}));voiceSearchStatus.textContent='ค้นหา: '+spoken;}};
  voiceRecognition.onerror=event=>{const messages={ 'not-allowed':'ไม่ได้รับอนุญาตให้ใช้ไมโครโฟน กรุณาอนุญาตในเบราว์เซอร์','no-speech':'ไม่ได้ยินเสียงพูด กรุณาลองอีกครั้ง','network':'การรู้จำเสียงขัดข้อง กรุณาตรวจสอบอินเทอร์เน็ต','service-not-allowed':'เบราว์เซอร์ไม่อนุญาตให้ใช้บริการรู้จำเสียง'};voiceSearchStatus.textContent=messages[event.error]||'ค้นหาด้วยเสียงไม่สำเร็จ กรุณาลองอีกครั้ง';};
  voiceRecognition.onend=()=>{voiceListening=false;voiceSearchButton.textContent='🎙️ พูดเพื่อค้นหา';};
  voiceSearchButton.addEventListener('click',()=>{if(voiceListening){voiceRecognition.stop();return;}voiceSearchStatus.textContent='';try{voiceRecognition.start();}catch(error){voiceSearchStatus.textContent='เริ่มใช้ไมโครโฟนไม่ได้ กรุณาลองกดอีกครั้ง';}});
}$('editMode').hidden=false;$('editorBar').hidden=false;updateEditControls();$('lock').addEventListener('click',()=>{if(syncTimer){clearInterval(syncTimer);syncTimer=null;}currentPassphrase='';editing=false;recipes=[];$('cards').replaceChildren();$('search').value='';$('book').hidden=true;$('lock').hidden=true;$('gate').hidden=false;$('password').focus();});
</script></body></html>
