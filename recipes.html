</style></head><body><main><header><img src="assets/logo.png" alt="ชงและปั่น"><div><h1>สูตรเมนูสำหรับร้าน</h1><span class="tag">ชง&ปั่น · สมุดสูตรประจำร้าน</span></div><button id="lock" hidden>ล็อกหน้า</button></header><section id="gate" class="panel login"><h2>เข้าสู่หน้าสูตร</h2><p>ใส่รหัสผ่านเพื่อเปิดสมุดสูตรของร้าน</p><form id="login"><label for="password">รหัสผ่าน</label><input id="password" type="password" inputmode="numeric" autocomplete="current-password" required><button id="submit">เปิดสมุดสูตร</button><p id="error" role="alert" aria-live="polite"></p></form></section><section id="book" hidden><div class="note">เตรียมรายการเมนูไว้แล้ว ยังไม่ได้ใส่สูตรจริง ส่งวัตถุดิบ ปริมาณ ขนาดแก้ว และวิธีทำเพื่อเพิ่มสูตรแต่ละเมนูได้ครับ</div><div class="tools"><input id="search" type="search" placeholder="ค้นหาชื่อเมนู" aria-label="ค้นหาชื่อเมนู"><select id="category" aria-label="หมวดหมู่"><option value="">ทุกหมวด</option></select></div><div id="cards" class="grid"></div><p id="noResults" hidden>ไม่พบเมนูที่ค้นหา</p><footer>กด “ล็อกหน้า” เมื่อใช้งานเสร็จ</footer></section></main><script>

const $=id=>document.getElementById(id);let recipes=[];
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function render(){const q=$('search').value.trim();const category=$('category').value;$('cards').replaceChildren();let count=0;for(const group of recipes){if(category&&category!==group.category)continue;for(const name of group.names){if(q&&!name.includes(q))continue;count++;const card=document.createElement('article');card.className='panel';const tag=document.createElement('span');tag.className='tag';tag.textContent=group.category;const title=document.createElement('h2');title.textContent=name;const status=document.createElement('p');status.className='empty';status.textContent='ยังไม่มีสูตร · รอเพิ่มวัตถุดิบ ปริมาณ และวิธีทำ';card.append(tag,title,status);$('cards').append(card);}}$('noResults').hidden=!!count;}
$('login').addEventListener('submit',async event=>{event.preventDefault();$('error').textContent='';$('submit').disabled=true;try{if(!crypto.subtle)throw new Error('unsupported');const material=await crypto.subtle.importKey('raw',new TextEncoder().encode($('password').value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.data));recipes=JSON.parse(new TextDecoder().decode(plain));$('category').replaceChildren(new Option('ทุกหมวด',''),...recipes.map(x=>new Option(x.category,x.category)));$('gate').hidden=true;$('book').hidden=false;$('lock').hidden=false;$('password').value='';render();$('search').focus();}catch(e){$('error').textContent=e.message==='unsupported'?'กรุณาเปิดหน้านี้ผ่าน HTTPS':'รหัสผ่านไม่ถูกต้อง กรุณาลองอีกครั้ง';}finally{$('submit').disabled=false;}});
$('search').addEventListener('input',render);$('category').addEventListener('change',render);$('lock').addEventListener('click',()=>{recipes=[];$('cards').replaceChildren();$('search').value='';$('book').hidden=true;$('lock').hidden=true;$('gate').hidden=false;$('password').focus();});
