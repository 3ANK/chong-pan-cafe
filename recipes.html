function render(){const q=$('search').value.trim();const category=$('category').value;$('cards').replaceChildren();let count=0;for(const group of recipes){if(category&&category!==group.category)continue;for(const name of group.names){if(q&&!name.includes(q)&&!group.details?.[name]?.title.includes(q))continue;count++;const card=document.createElement('article');card.className='panel';const tag=document.createElement('span');tag.className='tag';tag.textContent=group.category;const detail=group.details?.[name];const title=document.createElement('h2');title.textContent=detail?.title?detail.title+(name.includes(' · สูตร ')?' · '+name.split(' · ').at(-1):''):name;card.append(tag,title);if(detail){const list=document.createElement('ul');list.className='ingredients';for(const ingredient of detail.ingredients){const item=document.createElement('li');item.textContent=ingredient;list.append(item);}card.append(list);if(detail.size){const size=document.createElement('p');size.className='tag';size.textContent='ขนาดแก้ว '+detail.size+' ออนซ์';card.insertBefore(size,list);}if(detail.steps?.length){const heading=document.createElement('h3');heading.textContent='วิธีทำ';const steps=document.createElement('ol');steps.className='ingredients';for(const text of detail.steps){const li=document.createElement('li');li.textContent=text;steps.append(li);}card.append(heading,steps);}for(const text of detail.notes||[]){const note=document.createElement('p');note.className='recipe-note';note.textContent=text;card.append(note);}if(detail.source){const source=document.createElement('p');source.className='source';source.textContent='ต้นฉบับ: '+detail.source;card.append(source);}}else{const status=document.createElement('p');status.className='empty';status.textContent='ยังไม่มีสูตร · รอเพิ่มวัตถุดิบ ปริมาณ และวิธีทำ';card.append(status);}$('cards').append(card);}}$('noResults').hidden=!!count;}
$('login').addEventListener('submit',async event=>{event.preventDefault();$('error').textContent='';$('submit').disabled=true;try{if(!crypto.subtle)throw new Error('unsupported');const material=await crypto.subtle.importKey('raw',new TextEncoder().encode($('password').value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.data));recipes=JSON.parse(new TextDecoder().decode(plain));$('category').replaceChildren(new Option('ทุกหมวด',''),...recipes.map(x=>new Option(x.category,x.category)));$('gate').hidden=true;$('book').hidden=false;$('lock').hidden=false;$('password').value='';render();$('search').focus();}catch(e){$('error').textContent=e.message==='unsupported'?'กรุณาเปิดหน้านี้ผ่าน HTTPS':'รหัสผ่านไม่ถูกต้อง กรุณาลองอีกครั้ง';}finally{$('submit').disabled=false;}});
$('search').addEventListener('input',render);$('category').addEventListener('change',render);$('lock').addEventListener('click',()=>{recipes=[];$('cards').replaceChildren();$('search').value='';$('book').hidden=true;$('lock').hidden=true;$('gate').hidden=false;$('password').focus();});
</script></body></html>
