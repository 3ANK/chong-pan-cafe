<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เอสเพรสโซ 3D · ชง&ปั่น</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f8f4e8;color:#30402c;font:16px Tahoma,sans-serif}header{display:flex;justify-content:space-between;padding:20px 6%;border-bottom:1px solid #d9ddcd}a{color:inherit}main{max-width:1000px;margin:auto;padding:24px;text-align:center}small{letter-spacing:3px;color:#737e60}h1{font-size:34px;margin:12px}p{color:#6c725f;line-height:1.7}#stage{height: min(60vh,540px);min-height:310px;position:relative;background:radial-gradient(ellipse,#e9e3cb,transparent 67%);border-radius:24px;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}#status{position:absolute;inset:45% 10% auto;pointer-events:none}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button{border:1px solid #c9cfba;border-radius:30px;padding:12px 20px;background:#fffdf5;color:#405332;cursor:pointer;font:inherit}button:focus-visible,canvas:focus-visible{outline:3px solid #9b642c;outline-offset:3px}button[aria-pressed=true]{background:#536938;color:white}.price{font-size:30px;font-weight:bold}.note{font-size:12px}footer{margin-top:24px;font-size:13px;color:#7d826e}</style>
<header><b>ชง&ปั่น · CHONG & PAN</b><a href="./#coffee">กลับเมนู</a></header><main><small>ESPRESSO / 360°</small><h1>เอสเพรสโซเย็น</h1><div class="price">35 <span style="font-size:15px;font-weight:normal">บาท</span></div><div id="stage"><div id="status" role="status">กำลังเตรียมแก้ว 3D…</div></div><p>ลากเพื่อหมุนแก้ว · ใช้สองนิ้วเพื่อซูม<br><span class="note">คอมพิวเตอร์: ลากเมาส์ / ล้อเลื่อน / ปุ่มลูกศร</span></p><div class="controls"><button id="auto" aria-pressed="false">หมุนอัตโนมัติ</button><button id="minus" aria-label="ซูมออก">−</button><button id="plus" aria-label="ซูมเข้า">＋</button><button id="reset">มุมเริ่มต้น</button></div><footer>โมเดลจำลองสำหรับทดลองการหมุน • รูปลักษณ์และสัดส่วนอาจต่างจากแก้วจริง</footer></main>
<script type="module">
const status=document.querySelector('#status');
try {
const T=await import('https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js');
const stage=document.querySelector('#stage'),scene=new T.Scene(),camera=new T.PerspectiveCamera(35,1,.1,100);
const renderer=new T.WebGLRenderer({antialias:true,alpha:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0,0);renderer.outputColorSpace=T.SRGBColorSpace;stage.append(renderer.domElement);
const canvas=renderer.domElement;canvas.tabIndex=0;canvas.setAttribute('aria-label','แก้วเอสเพรสโซ 3D ใช้ปุ่มลูกศรหมุน และปุ่มบวกหรือลบซูม');
scene.add(new T.HemisphereLight(0xffffff,0x766545,3));const key=new T.DirectionalLight(0xfff5e4,4);key.position.set(3,5,6);scene.add(key);const rim=new T.DirectionalLight(0xffffff,2);rim.position.set(-4,2,-3);scene.add(rim);
const cup=new T.Group();scene.add(cup);
function mesh(g,m,x=0,y=0,z=0){const o=new T.Mesh(g,m);o.position.set(x,y,z);cup.add(o);return o}
const plastic=new T.MeshPhysicalMaterial({color:0xf6f4df,transparent:true,opacity:.17,roughness:.16,metalness:0,side:T.DoubleSide,depthWrite:false});
const coffeeCanvas=document.createElement('canvas');coffeeCanvas.width=32;coffeeCanvas.height=256;let ctx=coffeeCanvas.getContext('2d'),grad=ctx.createLinearGradient(0,0,0,256);grad.addColorStop(0,'#43271b');grad.addColorStop(.4,'#875234');grad.addColorStop(1,'#b48150');ctx.fillStyle=grad;ctx.fillRect(0,0,32,256);const coffeeTex=new T.CanvasTexture(coffeeCanvas);coffeeTex.colorSpace=T.SRGBColorSpace;
mesh(new T.CylinderGeometry(.73,.55,1.85,64),new T.MeshStandardMaterial({map:coffeeTex,roughness:.33}),0,-.09,0);
mesh(new T.CylinderGeometry(.79,.57,2.15,64,1,true),plastic);
function ring(radius,tube,y,material){let r=mesh(new T.TorusGeometry(radius,tube,12,80),material,0,y,0);r.rotation.x=Math.PI/2;return r}
const edge=new T.MeshPhysicalMaterial({color:0xfaf8ef,transparent:true,opacity:.63,roughness:.19});ring(.79,.036,1.08,edge);ring(.57,.025,-1.07,edge);ring(.82,.045,1.12,edge);
mesh(new T.CylinderGeometry(.82,.82,.045,64),new T.MeshPhysicalMaterial({color:0xffffff,transparent:true,opacity:.22,roughness:.12,depthWrite:false}),0,1.12,0);
const iceMat=new T.MeshPhysicalMaterial({color:0xe8ded0,transparent:true,opacity:.72,roughness:.18,metalness:.08});
[[.30,.84,.26],[-.27,.9,.31],[.22,.94,-.3],[-.32,.85,-.24],[0,.96,0]].forEach(([x,y,z],i)=>{let o=mesh(new T.BoxGeometry(.35,.27,.31),iceMat,x,y,z);o.rotation.set(i*.24,.3+i*.7,.12+i*.17)});
const straw=mesh(new T.CylinderGeometry(.045,.045,1.38,20),new T.MeshStandardMaterial({color:0x536d39,roughness:.6}),.38,1.23,-.16);straw.rotation.z=-.13;
const hole=mesh(new T.CircleGeometry(.031,20),new T.MeshBasicMaterial({color:0x263c24}),.47,1.915,-.16);hole.rotation.x=-Math.PI/2;
const label=document.createElement('canvas');label.width=1024;label.height=512;const c=label.getContext('2d');c.fillStyle='#fff9e9';c.beginPath();c.ellipse(512,256,420,224,0,0,Math.PI*2);c.fill();c.fillStyle='#506435';c.textAlign='center';c.textBaseline='middle';c.font='bold 112px Tahoma,sans-serif';c.fillText('ชง&ปั่น',512,225);c.font='32px sans-serif';c.fillText('C H O N G  &  P A N',512,330);const tex=new T.CanvasTexture(label);tex.colorSpace=T.SRGBColorSpace;
mesh(new T.CylinderGeometry(.704,.644,.8,48,1,true,-.92,1.84),new T.MeshStandardMaterial({map:tex,transparent:true,roughness:.8,side:T.DoubleSide}),0,-.12,0);
// Soft contact shadow stays on the table while the cup rotates.
const sc=document.createElement('canvas');sc.width=sc.height=128;const s=sc.getContext('2d'),g=s.createRadialGradient(64,64,4,64,64,64);g.addColorStop(0,'rgba(65,45,20,.24)');g.addColorStop(1,'rgba(65,45,20,0)');s.fillStyle=g;s.fillRect(0,0,128,128);const shadow=new T.Mesh(new T.PlaneGeometry(3.5,3.5),new T.MeshBasicMaterial({map:new T.CanvasTexture(sc),transparent:true,depthWrite:false}));shadow.rotation.x=-Math.PI/2;shadow.position.y=-1.13;scene.add(shadow);
let yaw=0,pitch=.08,distance=6.6,auto=false,visible=true;const pointers=new Map();let prevPinch=0;
function zoom(f){distance=T.MathUtils.clamp(distance*f,4.5,9);render()}
function render(){cup.rotation.set(pitch,yaw,0);camera.position.set(0,1.3,distance);camera.lookAt(0,.35,0);renderer.render(scene,camera)}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();render()}new ResizeObserver(resize).observe(stage);
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});prevPinch=0;auto=false;document.querySelector('#auto').setAttribute('aria-pressed','false')});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const p=pointers.get(e.pointerId);const dx=e.clientX-p.x,dy=e.clientY-p.y;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){yaw+=dx*.012;pitch=T.MathUtils.clamp(pitch+dy*.008,-.5,.65)}else{const [a,b]=[...pointers.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(prevPinch&&d)zoom(prevPinch/d);prevPinch=d}render()});
function release(e){pointers.delete(e.pointerId);prevPinch=0}['pointerup','pointercancel','lostpointercapture'].forEach(n=>canvas.addEventListener(n,release));
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(e.deltaY*.001))},{passive:false});
canvas.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','-','='].includes(e.key))return;e.preventDefault();if(e.key==='ArrowLeft')yaw-=.15;if(e.key==='ArrowRight')yaw+=.15;if(e.key==='ArrowUp')pitch=Math.max(-.5,pitch-.1);if(e.key==='ArrowDown')pitch=Math.min(.65,pitch+.1);if(e.key==='+'||e.key==='=')zoom(.9);if(e.key==='-')zoom(1.1);render()});
document.querySelector('#plus').onclick=()=>zoom(.9);document.querySelector('#minus').onclick=()=>zoom(1.1);document.querySelector('#auto').onclick=e=>{auto=!auto;e.currentTarget.setAttribute('aria-pressed',String(auto))};document.querySelector('#reset').onclick=()=>{yaw=0;pitch=.08;distance=6.6;auto=false;document.querySelector('#auto').setAttribute('aria-pressed','false');render()};
new IntersectionObserver(([e])=>visible=e.isIntersecting).observe(stage);let last=0;renderer.setAnimationLoop(t=>{let dt=Math.min((t-last)/1000,.05);last=t;if(auto&&visible&&!document.hidden){yaw+=dt*.45;render()}});canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();status.hidden=false;status.textContent='การแสดงผลหยุดชั่วคราว กรุณาโหลดหน้านี้ใหม่'});resize();status.hidden=true;
} catch(e){status.textContent='เปิดภาพ 3D ไม่สำเร็จ กรุณาตรวจอินเทอร์เน็ตและลองใช้เบราว์เซอร์ที่รองรับ WebGL';console.error(e)}
</script></html>
